
name: iOS Build Check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcodebuild -version
          python3 --version

      - name: Install dependencies
        run: |
          brew install bazelisk

      - name: Check Telegram build configuration
        run: |
          python3 build-system/Make/Make.py --help
