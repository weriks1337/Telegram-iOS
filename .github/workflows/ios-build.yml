
name: iOS Build Check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ayugram-ios
          submodules: false
          fetch-depth: 0

      - name: Verify configuration
        run: |
          echo "BRANCH:"
          git branch --show-current
          echo "TGCALLS URL:"
          git config -f .gitmodules --get submodule.submodules/TgVoipWebrtc/tgcalls.url

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Select Xcode
        run: |
          xcodebuild -version
          python3 --version

      - name: Install dependencies
        run: |
          brew install bazelisk

      - name: Check Telegram build configuration
        run: |
          python3 build-system/Make/Make.py --help
