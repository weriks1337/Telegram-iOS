
name: iOS Build Check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ayugram-ios
          submodules: recursive
          fetch-depth: 0

      - name: Show selected revision
        run: |
          git branch --show-current
          git log -1 --oneline
          grep -A 2 'TgVoipWebrtc/tgcalls' .gitmodules

      - name: Select Xcode
        run: |
          xcodebuild -version
          python3 --version

      - name: Install dependencies
        run: |
          brew install bazelisk

      - name: Check Telegram build configuration
        run: |
          python3 build-system/Make/Make.py --help
